<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang đăng nhập</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <h1>Đăng nhập</h1>
    <p>Username:</p>
    <input type="text" id="txtUsername" />
    <p>Mật khẩu:</p>
    <input type="password" id="txtPassword" />
    <br />
    <br />
    <button id="btnLogin">Đăng nhập</button>

    <p class="error hidden">Đăng nhập thất bại. Vui lòng kiểm tra lại</p>

    <!-- Đường dẫn tương đối(relative path) 
        + ./ đi đến thư mục chứa file hiện hành
        + / đi đến thư mực root (gốc) 

        Đường dẫn tuyệt đối (absolute path):
        www.google.com.vn => trực tiếp link tới trang.
    -->
    <script src="./js/main.js"></script>
  </body>
</html>
